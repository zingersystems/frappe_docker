name: academia-frappe

x-image: &image
  image: ${FRAPPE_IMAGE:?Set FRAPPE_IMAGE to the registry image digest}
  pull_policy: always
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  security_opt:
    - no-new-privileges:true

x-configured: &configured
  depends_on:
    configurator:
      condition: service_completed_successfully

x-runtime: &runtime
  <<: [*image, *configured]
  restart: unless-stopped
  stop_grace_period: 60s
  extra_hosts:
    - "${PUBLIC_HOSTNAME:-portal.catuc.org}:host-gateway"
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  networks:
    - frappe

services:
  configurator:
    <<: *image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host "$$DB_HOST";
        bench set-config -gp db_port "$$DB_PORT";
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port "$$SOCKETIO_PORT";
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
        for site_config in sites/*/site_config.json; do
          [ -f "$$site_config" ] || continue;
          site=$${site_config#sites/};
          site=$${site%/site_config.json};
          bench --site "$$site" set-config db_host "$$DB_HOST";
        done
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    extra_hosts:
      - "${PUBLIC_HOSTNAME:-portal.catuc.org}:host-gateway"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  backend:
    <<: *runtime
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --header 'Host: ${SITE_NAME:-portal.catuc.org}' http://127.0.0.1:8000/api/method/ping >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrator:
    <<: *runtime
    restart: on-failure:5
    entrypoint: ["bash", "-c"]
    command:
      - >
        if [ "$$MIGRATE_SITES" != "true" ]; then
          echo "[migrator] Migration disabled";
          exit 0;
        fi;
        if [ -z "$$(find sites -mindepth 2 -maxdepth 2 -name site_config.json 2>/dev/null)" ]; then
          echo "[migrator] No sites found, skipping migration";
          exit 0;
        fi;
        echo "[migrator] Migrating all sites";
        bench --site all migrate;
    environment:
      MIGRATE_SITES: ${MIGRATE_SITES:-true}

  frontend:
    <<: *image
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-portal.catuc.org}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1/32}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe
      - edge
    depends_on:
      backend:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      websocket:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --header 'Host: ${PUBLIC_HOSTNAME:-portal.catuc.org}' http://127.0.0.1:8080/api/method/ping >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: ${TRAEFIK_ENABLE:-false}
      traefik.docker.network: ${EDGE_NETWORK:?Set EDGE_NETWORK to the live Traefik network}
      traefik.http.routers.academia-frappe.rule: Host(`${PUBLIC_HOSTNAME:-portal.catuc.org}`)
      traefik.http.routers.academia-frappe.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.academia-frappe.tls: "true"
      traefik.http.routers.academia-frappe.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-main-resolver}
      traefik.http.routers.academia-frappe.service: academia-frappe
      traefik.http.services.academia-frappe.loadbalancer.server.port: "8080"

  websocket:
    <<: [*image, *configured]
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe

  queue-short:
    <<: *runtime
    command: ["bench", "worker", "--queue", "short"]

  queue-default:
    <<: *runtime
    command: ["bench", "worker", "--queue", "default"]

  queue-long:
    <<: *runtime
    command: ["bench", "worker", "--queue", "long"]

  scheduler:
    <<: *runtime
    command: ["bench", "schedule"]

  backup:
    <<: *runtime
    profiles: ["operations"]
    restart: "no"
    command: ["bench", "--site", "${SITE_NAME:-portal.catuc.org}", "backup", "--with-files", "--compress"]

  restore:
    <<: [*image, *configured]
    profiles: ["operations"]
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        set -euo pipefail;
        cd /snapshot;
        sha256sum --check SHA256SUMS;
        cd /home/frappe/frappe-bench;
        test ! -e "sites/$$SITE_NAME";
        db_root_password=$$(tr -d '\r\n' < /run/secrets/mariadb_root_password);
        db_password=$$(openssl rand -hex 24);
        admin_password=$$(openssl rand -base64 36);
        encryption_key=$$(python -c 'import json; print(json.load(open("/snapshot/site-config.json"))["encryption_key"])');
        bench new-site "$$SITE_NAME"
        --db-host mariadb
        --db-port 3306
        --db-root-username root
        --db-root-password "$$db_root_password"
        --db-password "$$db_password"
        --mariadb-user-host-login-scope=%
        --admin-password "$$admin_password";
        bench --site "$$SITE_NAME" set-config encryption_key "$$encryption_key";
        bench --site "$$SITE_NAME" restore /snapshot/database.sql.gz
        --with-public-files /snapshot/public-files.tgz
        --with-private-files /snapshot/private-files.tgz
        --db-root-username root
        --db-root-password "$$db_root_password";
        bench --site "$$SITE_NAME" set-config host_name "https://$$PUBLIC_HOSTNAME";
        bench --site "$$SITE_NAME" set-config developer_mode 0;
        bench --site "$$SITE_NAME" set-config allow_tests false;
        bench --site "$$SITE_NAME" set-config maintenance_mode 1;
        bench use "$$SITE_NAME";
        chmod 0600 "sites/$$SITE_NAME/site_config.json";
        printf '%s\n' "Candidate restore complete in maintenance mode";
    environment:
      SITE_NAME: ${SITE_NAME:-portal.catuc.org}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-portal.catuc.org}
    secrets:
      - mariadb_root_password
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ${AUTHORITY_SNAPSHOT:?Set AUTHORITY_SNAPSHOT to the remote checksummed snapshot}:/snapshot:ro
    networks:
      - frappe

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    secrets:
      - mariadb_root_password
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - frappe
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - frappe
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data
    networks:
      - frappe
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

secrets:
  mariadb_root_password:
    file: ${SECRETS_DIR:-/srv/apps/academia/frappe/secrets}/mariadb_root_password

networks:
  frappe:
    external: true
    name: frappe
  edge:
    external: true
    name: ${EDGE_NETWORK:?Set EDGE_NETWORK to the live Traefik network}

volumes:
  mariadb-data:
    name: academia-frappe_mariadb-data
  redis-queue-data:
    name: academia-frappe_redis-queue-data
  sites:
    name: academia-frappe_sites
  logs:
    name: academia-frappe_logs